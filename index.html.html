<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairs — NBA News &amp; Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15120e;
    --ink-soft:#211c15;
    --ink-line:#3a3226;
    --paper:#f2ece0;
    --paper-dim:#d9d0bd;
    --hardwood:#c1793c;
    --hardwood-deep:#8f5322;
    --buzzer:#d5473b;
    --court-line:#e9e0c9;
    --court-line-dim:#7c7261;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--court-line);
    font-family:'Source Serif 4', serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton', sans-serif; letter-spacing:0.02em; text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono', monospace;}
  ::selection{background:var(--hardwood); color:var(--ink);}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:var(--ink);
    border-bottom:2px solid var(--ink-line);
  }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .logo{display:flex; align-items:baseline; gap:10px;}
  .logo .mark{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, var(--hardwood), var(--hardwood-deep) 70%);
    position:relative; flex:none;
    box-shadow: inset -3px -3px 6px rgba(0,0,0,.35);
  }
  .logo .mark::before,.logo .mark::after{ content:""; position:absolute; background:var(--ink); }
  .logo .mark::before{ left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%); }
  .logo .mark::after{ top:50%; left:0; right:0; height:2px; transform:translateY(-50%); }
  .logo .word{ font-size:24px; color:var(--paper); }
  .logo .word span{color:var(--hardwood);}
  nav.main{display:flex; gap:6px; align-items:center;}
  nav.main button{
    background:none; border:none; color:var(--court-line-dim);
    font-family:'Anton',sans-serif; letter-spacing:.06em; text-transform:uppercase;
    font-size:14px; padding:10px 14px; border-radius:3px; transition:color .15s, background .15s;
  }
  nav.main button:hover{color:var(--paper);}
  nav.main button.active{color:var(--ink); background:var(--court-line);}
  .publish-btn{ background:var(--buzzer)!important; color:var(--paper)!important; }
  .publish-btn:hover{ filter:brightness(1.1); color:var(--paper)!important;}

  /* ---------- Layout ---------- */
  main{max-width:1180px; margin:0 auto; padding:0 24px 80px;}
  .divider-court{ height:0; border-top:2px dashed var(--ink-line); margin:44px 0; }
  .eyebrow{
    font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.14em;
    color:var(--hardwood); text-transform:uppercase; margin:0 0 10px;
  }

  /* ---------- Hero ---------- */
  .hero{ display:grid; grid-template-columns:1.3fr 1fr; gap:40px; padding:48px 0 8px; align-items:end; }
  .hero-headline{
    font-family:'Anton',sans-serif; font-size:clamp(38px,6vw,64px); line-height:0.98;
    color:var(--paper); margin:10px 0 18px; text-transform:uppercase;
  }
  .hero-dek{font-size:17px; line-height:1.55; color:var(--paper-dim); max-width:52ch;}
  .hero-meta{margin-top:20px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim);}
  .hero-side{ background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:2px; padding:22px; }
  .hero-side h3{
    font-family:'Anton',sans-serif; font-size:14px; letter-spacing:.08em; color:var(--paper);
    margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--ink-line);
  }
  .mini-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:14px;}
  .mini-row+.mini-row{border-top:1px dotted var(--ink-line);}
  .mini-row .team{display:flex; align-items:center; gap:8px; color:var(--court-line);}
  .swatch{width:9px;height:18px;border-radius:1px; flex:none;}
  .mini-row .rec{font-family:'JetBrains Mono',monospace; color:var(--paper-dim); font-size:13px;}
  .see-all{
    display:block; text-align:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--ink-line);
    font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.08em; color:var(--hardwood);
  }
  .see-all:hover{color:var(--paper);}

  /* ---------- Article grid ---------- */
  .grid-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px;}
  .section-title{font-family:'Anton',sans-serif; font-size:28px; color:var(--paper); text-transform:uppercase; margin:0;}
  .article-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}
  .card{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:2px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .15s, border-color .15s; cursor:pointer;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--hardwood);}
  .card-art{ height:140px; display:flex; align-items:center; justify-content:center; font-size:44px; color:rgba(21,18,14,.55); }
  .card-body{padding:18px 18px 20px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--hardwood); letter-spacing:.04em;}
  .card h4{font-family:'Anton',sans-serif; font-size:19px; line-height:1.15; color:var(--paper); margin:0; text-transform:uppercase;}
  .card p{font-size:14px; line-height:1.5; color:var(--paper-dim); margin:0; flex:1;}
  .card-foot{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim); margin-top:4px;}

  /* ---------- Standings ---------- */
  .conf-toggle{display:flex; gap:8px; margin-bottom:20px;}
  .conf-toggle button{
    background:var(--ink-soft); border:1px solid var(--ink-line); color:var(--court-line-dim);
    font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.06em; padding:9px 18px; border-radius:2px;
  }
  .conf-toggle button.active{background:var(--hardwood); color:var(--ink); border-color:var(--hardwood);}
  table.standings{width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:13px;}
  table.standings th{
    text-align:left; font-family:'Anton',sans-serif; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--court-line-dim); padding:10px 12px; border-bottom:2px solid var(--ink-line);
  }
  table.standings td{padding:9px 12px; border-bottom:1px solid var(--ink-line); color:var(--court-line);}
  table.standings tr:hover td{background:var(--ink-soft);}
  table.standings td.rank{color:var(--paper-dim); width:30px;}
  table.standings td.team-cell{color:var(--paper); font-family:'Source Serif 4',serif; font-size:14px; font-weight:600;}
  table.standings input{
    width:52px; background:var(--ink-soft); border:1px solid var(--ink-line); color:var(--court-line);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:5px 6px; border-radius:2px;
  }
  table.standings input:focus{outline:2px solid var(--hardwood); outline-offset:1px;}
  .standings-actions{display:flex; align-items:center; gap:14px; margin-top:18px;}

  /* ---------- Buttons / fields (shared) ---------- */
  .field{margin-bottom:18px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-family:'Anton',sans-serif; font-size:11px; letter-spacing:.08em; color:var(--hardwood); text-transform:uppercase;}
  .field input, .field select, .field textarea{
    background:var(--ink-soft); border:1px solid var(--ink-line); color:var(--paper);
    padding:11px 13px; border-radius:2px; font-family:'Source Serif 4',serif; font-size:15px;
  }
  .field textarea{min-height:180px; resize:vertical; line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--hardwood); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .row4{display:grid; grid-template-columns:1fr auto 1fr auto; gap:12px; align-items:end;}
  .submit-btn{
    background:var(--buzzer); color:var(--paper); border:none; padding:13px 26px;
    font-family:'Anton',sans-serif; letter-spacing:.06em; font-size:14px; border-radius:2px; text-transform:uppercase;
  }
  .submit-btn:hover{filter:brightness(1.1);}
  .submit-btn:disabled{opacity:.5; cursor:default;}
  .ghost-btn{
    background:none; border:1px solid var(--ink-line); color:var(--court-line-dim);
    padding:12px 22px; font-family:'Anton',sans-serif; letter-spacing:.06em; font-size:13px; border-radius:2px; text-transform:uppercase;
  }
  .ghost-btn:hover{color:var(--paper); border-color:var(--hardwood);}
  .form-note{font-size:13px; color:var(--court-line-dim); margin-top:10px; line-height:1.5;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--hardwood); color:var(--ink);
    padding:14px 20px; border-radius:2px; font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.04em;
    box-shadow:0 8px 24px rgba(0,0,0,.4); transform:translateY(140%); transition:transform .25s ease; z-index:100;
  }
  .toast.show{transform:translateY(0);}

  /* ---------- Scores page ---------- */
  .score-entry{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:2px; padding:18px 20px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .score-line{display:flex; align-items:center; gap:16px; font-family:'JetBrains Mono',monospace; font-size:16px;}
  .score-line .vs-team{display:flex; align-items:center; gap:8px; color:var(--paper);}
  .score-line .score-num{font-size:22px; font-weight:700; color:var(--paper);}
  .score-status{font-family:'Anton',sans-serif; font-size:11px; letter-spacing:.06em; color:var(--hardwood);}
  .score-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim);}
  .empty-state{padding:60px 0; text-align:center; color:var(--court-line-dim); font-family:'JetBrains Mono',monospace; font-size:14px;}

  /* ---------- Free agency moves ---------- */
  .move-entry{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:2px; padding:16px 20px; margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .move-main{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .move-player{font-family:'Anton',sans-serif; font-size:17px; color:var(--paper); text-transform:uppercase;}
  .move-path{display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--paper-dim);}
  .move-team{display:flex; align-items:center; gap:6px;}
  .move-arrow{color:var(--hardwood);}
  .move-contract{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--hardwood);}
  .move-side{display:flex; align-items:center; gap:14px;}
  .move-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim);}
  .home-widget-list{display:flex; flex-direction:column; gap:0;}

  /* ---------- Trades ---------- */
  .trade-card{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:2px;
    margin-bottom:16px; overflow:hidden;
  }
  .trade-card-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px; border-bottom:1px dashed var(--ink-line);
  }
  .trade-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim);}
  .trade-body{display:grid; grid-template-columns:1fr auto 1fr;}
  .trade-side{padding:18px 20px;}
  .trade-team-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .trade-team-head .swatch{width:12px; height:22px;}
  .trade-team-head span{font-family:'Anton',sans-serif; font-size:16px; color:var(--paper); text-transform:uppercase;}
  .trade-receives-label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--court-line-dim); text-transform:uppercase; margin-bottom:6px;}
  .trade-assets{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
  .trade-assets li{font-size:14px; color:var(--court-line); padding-left:14px; position:relative;}
  .trade-assets li::before{content:"—"; position:absolute; left:0; color:var(--hardwood);}
  .trade-divider{
    width:1px; background:repeating-linear-gradient(to bottom, var(--ink-line) 0 6px, transparent 6px 12px);
    position:relative;
  }
  .trade-divider::after{
    content:"⇄"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--ink-soft); color:var(--hardwood); font-size:18px; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; border:1px solid var(--ink-line); border-radius:50%;
  }
  .trade-remove{padding:10px 18px 16px; text-align:right;}
  #tradeForm textarea{min-height:90px;}
  @media(max-width:640px){
    .trade-body{grid-template-columns:1fr;}
    .trade-divider{width:100%; height:1px; background:repeating-linear-gradient(to right, var(--ink-line) 0 6px, transparent 6px 12px);}
    .trade-divider::after{transform:translate(-50%,-50%) rotate(90deg);}
  }

  /* ---------- Article detail ---------- */
  .article-detail{max-width:720px; margin:0 auto;}
  .back-link{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim); display:inline-block; margin-bottom:24px;}
  .back-link:hover{color:var(--hardwood);}
  .article-detail h1{font-family:'Anton',sans-serif; font-size:clamp(30px,5vw,46px); color:var(--paper); text-transform:uppercase; line-height:1.02; margin:10px 0 16px;}
  .article-detail .meta{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim); margin-bottom:28px;}
  .article-detail .body-copy{font-size:18px; line-height:1.75; color:var(--court-line);}
  .article-detail .body-copy p{margin:0 0 20px;}
  .art-cap{ height:220px; margin-bottom:30px; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:64px; color:rgba(21,18,14,.55); }

  .publish-panel{max-width:720px; margin:0 auto;}

  footer{border-top:1px solid var(--ink-line); padding:30px 24px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim);}

  @media(max-width:860px){
    .hero{grid-template-columns:1fr;}
    .article-grid{grid-template-columns:1fr 1fr;}
    nav.main{display:none;}
    .row2{grid-template-columns:1fr;}
  }
  @media(max-width:560px){
    .article-grid{grid-template-columns:1fr;}
    .header-inner{padding:14px 16px;}
    .row4{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <a href="#" class="logo" onclick="go('home');return false;">
      <div class="mark"></div>
      <div class="word display">FAIR<span>S</span></div>
    </a>
    <nav class="main">
      <button data-v="home" class="display">Home</button>
      <button data-v="scores" class="display">Scores</button>
      <button data-v="moves" class="display">Free Agency</button>
      <button data-v="trades" class="display">Trades</button>
      <button data-v="standings" class="display">Standings</button>
      <button data-v="publish" class="publish-btn display">+ Publish</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>FAIRS — an independent NBA news &amp; standings site · standings and scores are entered manually</footer>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Data ---------------- */
const TEAM_COLORS = {
  LAL:'#552583', BOS:'#007A33', GSW:'#FFC72C', DEN:'#0E2240', MIL:'#00471B',
  PHX:'#E56020', MIA:'#98002E', PHI:'#006BB6', NYK:'#F58426', DAL:'#00538C',
  OKC:'#007AC1', MIN:'#236192', NOP:'#0C2340', SAC:'#5A2D81', LAC:'#C8102E',
  MEM:'#5D76A9', CLE:'#860038', ORL:'#0077C0', IND:'#FDBB30', ATL:'#E03A3E',
  CHI:'#CE1141', BKN:'#000000', TOR:'#CE1141', WAS:'#002B5C', UTA:'#002B5C',
  SAS:'#C4CED4', POR:'#E03A3E', HOU:'#CE1141', DET:'#C8102E', CHA:'#1D1160'
};
const TEAM_NAMES = {
  LAL:'Lakers', BOS:'Celtics', GSW:'Warriors', DEN:'Nuggets', MIL:'Bucks',
  PHX:'Suns', MIA:'Heat', PHI:'76ers', NYK:'Knicks', DAL:'Mavericks',
  OKC:'Thunder', MIN:'Timberwolves', NOP:'Pelicans', SAC:'Kings', LAC:'Clippers',
  MEM:'Grizzlies', CLE:'Cavaliers', ORL:'Magic', IND:'Pacers', ATL:'Hawks',
  CHI:'Bulls', BKN:'Nets', TOR:'Raptors', WAS:'Wizards', UTA:'Jazz',
  SAS:'Spurs', POR:'Trail Blazers', HOU:'Rockets', DET:'Pistons', CHA:'Hornets'
};
const WEST_TEAMS = ['OKC','DEN','MIN','LAC','DAL','GSW','MEM','LAL','SAC','PHX','HOU','UTA','POR','SAS','NOP'];
const EAST_TEAMS = ['BOS','NYK','MIL','CLE','ORL','IND','PHI','MIA','ATL','CHI','BKN','TOR','CHA','WAS','DET'];

let SEED_ARTICLES = [
  {
    id:'seed-1', title:'Small-Ball Lineups Are Back in the Conversation',
    team:'GSW', dek:'A look at why five-out spacing is resurfacing as teams hunt for playoff matchup advantages.',
    author:'Newsroom', date:'2026-08-05', art:'🏀',
    content:`Coaches around the league are dusting off a lineup philosophy many had shelved: going small and spreading the floor with five players who can all shoot from range.\n\nThe appeal is simple. When a defense has to guess whether a big man will stay near the rim or step out to the arc, driving lanes open up that simply do not exist against a traditional two-big frontcourt.\n\nThe tradeoff is on the glass. Teams that commit to small-ball units have to be disciplined about boxing out in numbers rather than relying on size alone, and the margin for error shrinks in physical playoff series.\n\nExpect more front offices to prioritize switchable, multi-positional wings this offseason as the copycat league chases the format that has produced the best net ratings over the last two seasons.`
  },
  {
    id:'seed-2', title:'Rookie Class Grades: Who Outplayed Their Draft Slot',
    team:'SAS', dek:'A first-year checkpoint on which prospects are already exceeding expectations.',
    author:'Newsroom', date:'2026-08-03', art:'📈',
    content:`Every rookie class has a handful of players who look nothing like their draft position suggested, and this year is no exception.\n\nSeveral second-round picks have carved out real rotation minutes by doing one thing exceptionally well — floor spacing, point-of-attack defense, or rim protection — rather than trying to do everything at once. That kind of specialization tends to translate faster than a raw, do-it-all skill set.\n\nOn the other end, a few lottery picks are still adjusting to the pace and physicality of the league, which is a normal part of the developmental curve rather than a red flag on its own.\n\nThe clearest early signal across the class has been defensive versatility. Teams are increasingly unwilling to hide a rookie on one end of the floor, and the prospects passing that test are the ones climbing up depth charts fastest.`
  },
  {
    id:'seed-3', title:'The Case for Slowing Down the Pace-and-Space Era',
    team:'MEM', dek:'Some coaches are quietly pushing back against the three-point revolution.',
    author:'Newsroom', date:'2026-07-30', art:'🎯',
    content:`For a decade, the league's offensive identity has been built around pace and three-point volume. A smaller but growing group of coaches now argues the pendulum swung too far.\n\nTheir case centers on shot quality over shot quantity. A contested, early-clock three carries a lower expected value than a well-earned shot at the rim, even though both count as "modern" offense on the surface.\n\nTeams experimenting with a more balanced attack are leaning on delayed post touches and dribble hand-offs to manufacture switches, then attacking the resulting mismatch inside rather than immediately firing from deep.\n\nWhether this becomes a real counter-trend or stays a minority approach likely depends on whether it starts showing up in postseason results, where half-court execution tends to matter more than regular-season pace.`
  }
];

/* ---------------- State ---------------- */
let articles = [];
let scores = [];
let moves = [];
let trades = [];
let standings = {}; // { TEAM: {w, l} }
let currentView = 'home';
let currentArticleId = null;
let currentConf = 'east';

/* ---------------- Storage: local (works on any real host, saved in this browser) ---------------- */
const localDB = {
  get(key){
    try{
      const v = localStorage.getItem('fairs:'+key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  },
  set(key, value){
    try{
      localStorage.setItem('fairs:'+key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }
};

/* ---------------- Storage: articles ---------------- */
function loadArticles(){
  const stored = localDB.get('articles') || [];
  articles = [...stored, ...SEED_ARTICLES];
}
function saveNewArticle(article){
  const stored = localDB.get('articles') || [];
  stored.unshift(article);
  localDB.set('articles', stored);
  articles = [...stored, ...SEED_ARTICLES];
}

/* ---------------- Storage: scores ---------------- */
function loadScores(){
  scores = localDB.get('scores') || [];
}
function saveNewScore(entry){
  const stored = localDB.get('scores') || [];
  stored.unshift(entry);
  localDB.set('scores', stored);
  scores = stored;
}
function deleteScore(id){
  const stored = (localDB.get('scores') || []).filter(s=>s.id!==id);
  localDB.set('scores', stored);
  scores = stored;
}

/* ---------------- Storage: free agency moves ---------------- */
function loadMoves(){
  moves = localDB.get('moves') || [];
}
function saveNewMove(entry){
  const stored = localDB.get('moves') || [];
  stored.unshift(entry);
  localDB.set('moves', stored);
  moves = stored;
}
function deleteMove(id){
  const stored = (localDB.get('moves') || []).filter(m=>m.id!==id);
  localDB.set('moves', stored);
  moves = stored;
}

/* ---------------- Storage: trades ---------------- */
function loadTrades(){
  trades = localDB.get('trades') || [];
}
function saveNewTrade(entry){
  const stored = localDB.get('trades') || [];
  stored.unshift(entry);
  localDB.set('trades', stored);
  trades = stored;
}
function deleteTrade(id){
  const stored = (localDB.get('trades') || []).filter(t=>t.id!==id);
  localDB.set('trades', stored);
  trades = stored;
}

/* ---------------- Storage: standings ---------------- */
function blankStandings(){
  const obj = {};
  [...WEST_TEAMS, ...EAST_TEAMS].forEach(t=> obj[t] = {w:0,l:0});
  return obj;
}
function loadStandings(){
  standings = localDB.get('standings') || blankStandings();
}
function saveStandings(updated){
  localDB.set('standings', updated);
  standings = updated;
}

/* ---------------- Helpers ---------------- */
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'}).toUpperCase();
}
function teamColor(t){ return TEAM_COLORS[t] || 'var(--hardwood)'; }
function cardBg(t){
  const c = teamColor(t);
  return `background:repeating-linear-gradient(135deg, ${c}cc 0 2px, transparent 2px 22px), linear-gradient(160deg, ${c}, ${c}aa)`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

/* ---------------- Render: Home ---------------- */
function renderHome(){
  const sorted = [...articles].sort((a,b)=> new Date(b.date)-new Date(a.date));
  const hero = sorted[0];
  const rest = sorted.slice(1);
  const westRanked = [...WEST_TEAMS].sort((a,b)=>{
    const A = standings[a]||{w:0,l:0}, B = standings[b]||{w:0,l:0};
    const pctA = A.w+A.l ? A.w/(A.w+A.l) : 0, pctB = B.w+B.l ? B.w/(B.w+B.l) : 0;
    return pctB-pctA;
  }).slice(0,5);

  const recentMoves = moves.slice(0,5);

  return `
    <section class="hero">
      <div>
        <p class="eyebrow">Lead Story</p>
        <h1 class="hero-headline" onclick="openArticle('${hero.id}')" style="cursor:pointer">${hero.title}</h1>
        <p class="hero-dek">${hero.dek}</p>
        <p class="hero-meta">${hero.author} · ${fmtDate(hero.date)} · ${hero.team}</p>
      </div>
      <div class="hero-side">
        <h3>Western Conference</h3>
        ${westRanked.map((t,i)=>{
          const s = standings[t]||{w:0,l:0};
          return `<div class="mini-row">
            <span class="team"><span class="swatch" style="background:${teamColor(t)}"></span>${i+1}. ${TEAM_NAMES[t]}</span>
            <span class="rec">${s.w}-${s.l}</span>
          </div>`;
        }).join('')}
        <a class="see-all" onclick="go('standings')">Full Standings →</a>
      </div>
    </section>

    <div class="divider-court"></div>

    <section>
      <div class="grid-head">
        <h2 class="section-title">Free Agency</h2>
      </div>
      ${recentMoves.length ? `<div class="home-widget-list">${recentMoves.map(moveEntryHtml).join('')}</div>`
        : `<div class="empty-state">No moves added yet. <a class="see-all" style="display:inline; border:none; padding:0;" onclick="go('moves')">Add the first one →</a></div>`}
      ${recentMoves.length ? `<a class="see-all" onclick="go('moves')" style="margin-top:14px;">All Free Agency Moves →</a>` : ''}
    </section>

    <div class="divider-court"></div>

    <section>
      <div class="grid-head">
        <h2 class="section-title">Latest</h2>
      </div>
      <div class="article-grid">
        ${rest.map(cardHtml).join('')}
      </div>
    </section>
  `;
}

function cardHtml(a){
  return `
    <div class="card" onclick="openArticle('${a.id}')">
      <div class="card-art" style="${cardBg(a.team)}">${a.art}</div>
      <div class="card-body">
        <span class="tag">${a.team}</span>
        <h4>${a.title}</h4>
        <p>${a.dek}</p>
        <span class="card-foot">${a.author} · ${fmtDate(a.date)}</span>
      </div>
    </div>`;
}

/* ---------------- Render: Standings (editable) ---------------- */
function standingsRows(list){
  const ranked = [...list].sort((a,b)=>{
    const A = standings[a]||{w:0,l:0}, B = standings[b]||{w:0,l:0};
    const pctA = A.w+A.l ? A.w/(A.w+A.l) : 0, pctB = B.w+B.l ? B.w/(B.w+B.l) : 0;
    return pctB-pctA;
  });
  return ranked.map((t,i)=>{
    const s = standings[t]||{w:0,l:0};
    const pct = (s.w+s.l) ? (s.w/(s.w+s.l)).toFixed(3).slice(1) : '.000';
    return `
    <tr>
      <td class="rank">${i+1}</td>
      <td class="team-cell"><span class="swatch" style="background:${teamColor(t)}"></span>${TEAM_NAMES[t]}</td>
      <td><input type="number" min="0" max="82" value="${s.w}" data-team="${t}" data-field="w" class="standings-input"></td>
      <td><input type="number" min="0" max="82" value="${s.l}" data-team="${t}" data-field="l" class="standings-input"></td>
      <td>${pct}</td>
    </tr>`;
  }).join('');
}
function renderStandings(){
  const list = currentConf==='east' ? EAST_TEAMS : WEST_TEAMS;
  return `
    <div style="padding-top:40px;">
      <p class="eyebrow">League Data</p>
      <h2 class="section-title" style="margin-bottom:20px;">Standings</h2>
      <div class="conf-toggle">
        <button class="${currentConf==='east'?'active':''}" onclick="setConf('east')">Eastern</button>
        <button class="${currentConf==='west'?'active':''}" onclick="setConf('west')">Western</button>
      </div>
      <table class="standings" id="standingsTable">
        <thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>PCT</th></tr></thead>
        <tbody>${standingsRows(list)}</tbody>
      </table>
      <div class="standings-actions">
        <button class="submit-btn" id="saveStandingsBtn" onclick="handleSaveStandings()">Save Changes</button>
        <p class="form-note" style="margin:0;">Edit win/loss totals directly in the table, then save. Rows re-rank automatically by win percentage.</p>
      </div>
    </div>
  `;
}
async function handleSaveStandings(){
  const btn = document.getElementById('saveStandingsBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const updated = {...standings};
  document.querySelectorAll('.standings-input').forEach(inp=>{
    const team = inp.dataset.team, field = inp.dataset.field;
    let val = parseInt(inp.value,10);
    if(isNaN(val) || val<0) val = 0;
    if(!updated[team]) updated[team] = {w:0,l:0};
    updated[team][field] = val;
  });
  saveStandings(updated);
  showToast('Standings saved');
  render();
}

/* ---------------- Render: Scores (manual entry) ---------------- */
function renderScores(){
  const teamOptions = Object.keys(TEAM_COLORS).sort().map(t=>`<option value="${t}">${t} — ${TEAM_NAMES[t]}</option>`).join('');
  const list = scores.length ? scores.map(scoreEntryHtml).join('') : `<div class="empty-state">No scores entered yet — add the first one below.</div>`;
  return `
    <div style="padding-top:40px;">
      <p class="eyebrow">League Data</p>
      <h2 class="section-title" style="margin-bottom:24px;">Scores</h2>

      ${list}

      <div class="divider-court"></div>

      <h3 class="section-title" style="font-size:20px; margin-bottom:16px;">Add a Result</h3>
      <form id="scoreForm" onsubmit="return handleAddScore(event)">
        <div class="row4">
          <div class="field">
            <label>Away Team</label>
            <select id="s-away">${teamOptions}</select>
          </div>
          <div class="field">
            <label>Score</label>
            <input type="number" id="s-away-score" min="0" max="250" required>
          </div>
          <div class="field">
            <label>Home Team</label>
            <select id="s-home">${teamOptions}</select>
          </div>
          <div class="field">
            <label>Score</label>
            <input type="number" id="s-home-score" min="0" max="250" required>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Status</label>
            <input type="text" id="s-status" placeholder="e.g. FINAL, Q4 2:14, or leave blank" value="FINAL">
          </div>
          <div class="field">
            <label>Date</label>
            <input type="date" id="s-date">
          </div>
        </div>
        <button type="submit" class="submit-btn" id="scoreSubmitBtn">Add Result</button>
        <p class="form-note">Entries are stored and visible to everyone who opens this page.</p>
      </form>
    </div>
  `;
}
function scoreEntryHtml(s){
  return `
    <div class="score-entry">
      <div class="score-line">
        <span class="vs-team"><span class="swatch" style="background:${teamColor(s.away)}"></span>${s.away} <span class="score-num">${s.awayScore}</span></span>
        <span style="color:var(--court-line-dim);">&ndash;</span>
        <span class="vs-team"><span class="score-num">${s.homeScore}</span> ${s.home}<span class="swatch" style="background:${teamColor(s.home)}"></span></span>
      </div>

        <span class="score-status">${s.status || 'FINAL'}</span>
        <span class="score-date">${s.date ? fmtDate(s.date) : ''}</span>
        <button class="ghost-btn" style="padding:6px 12px; font-size:11px;" onclick="handleDeleteScore('${s.id}')">Remove</button>
      </div>
    </div>`;
}
async function handleAddScore(e){
  e.preventDefault();
  const btn = document.getElementById('scoreSubmitBtn');
  btn.disabled = true; btn.textContent = 'Adding…';
  const entry = {
    id: 's-'+Date.now(),
    away: document.getElementById('s-away').value,
    awayScore: document.getElementById('s-away-score').value,
    home: document.getElementById('s-home').value,
    homeScore: document.getElementById('s-home-score').value,
    status: document.getElementById('s-status').value.trim(),
    date: document.getElementById('s-date').value
  };
  saveNewScore(entry);
  showToast('Result added');
  render();
  return false;
}
function handleDeleteScore(id){
  deleteScore(id);
  showToast('Result removed');
  render();
}

/* ---------------- Render: Trades ---------------- */
function renderTrades(){
  const teamOptions = Object.keys(TEAM_COLORS).sort().map(t=>`<option value="${t}">${t} — ${TEAM_NAMES[t]}</option>`).join('');
  const list = trades.length ? trades.map(tradeCardHtml).join('') : `<div class="empty-state">No trades added yet — add the first one below.</div>`;
  return `
    <div style="padding-top:40px;">
      <p class="eyebrow">League Data</p>
      <h2 class="section-title" style="margin-bottom:24px;">Trades</h2>

      ${list}

      <div class="divider-court"></div>

      <h3 class="section-title" style="font-size:20px; margin-bottom:16px;">Add a Trade</h3>
      <form id="tradeForm" onsubmit="return handleAddTrade(event)">
        <div class="row2">
          <div class="field">
            <label>Team A</label>
            <select id="t-team-a">${teamOptions}</select>
          </div>
          <div class="field">
            <label>Team B</label>
            <select id="t-team-b">${teamOptions}</select>
          </div>
        </div>
        <div class="row2">
          <div class="field">

            <textarea id="t-a-gets" placeholder="One item per line, e.g.&#10;Dillon Brooks&#10;2027 2nd Rd Pick" required></textarea>

          <div class="field">
            <label>Team B Receives</label>

        <div class="field" style="max-width:240px;">
          <label>Date</label>

}
function tradeCardHtml(t){
  const aItems = (t.aGets||[]).map(i=>`<li>${i}</li>`).join('');
  const bItems = (t.bGets||[]).map(i=>`<li>${i}</li>`).join('');
  return `
    <div class="trade-card">
      <div class="trade-card-top">
        <span class="trade-date">${t.date ? fmtDate(t.date) : ''}</span>
        <button class="ghost-btn" style="padding:5px 12px; font-size:11px;" onclick="handleDeleteTrade('${t.id}')">Remove</button>

      <div class="trade-body">
        <div class="trade-side">

          <div class="trade-receives-label">Receives</div>
          <ul class="trade-assets">${aItems}</ul>
        </div>
        <div class="trade-divider"></div>
        <div class="trade-side">
          <div class="trade-team-head"><span class="swatch" style="background:${teamColor(t.teamB)}"></span><span>${TEAM_NAMES[t.teamB]}</span></div>
          <div class="trade-receives-label">Receives</div>
          <ul class="trade-assets">${bItems}</ul>
        </div>
      </div>
    </div>`;
}
function handleAddTrade(e){
  e.preventDefault();
  const btn = document.getElementById('tradeSubmitBtn');
  btn.disabled = true; btn.textContent = 'Adding…';
  const entry = {
    id: 't-'+Date.now(),
    teamA: document.getElementById('t-team-a').value,
    teamB: document.getElementById('t-team-b').value,
    aGets: document.getElementById('t-a-gets').value.split('\n').map(s=>s.trim()).filter(Boolean),
    bGets: document.getElementById('t-b-gets').value.split('\n').map(s=>s.trim()).filter(Boolean),
    date: document.getElementById('t-date').value
  };
  saveNewTrade(entry);
  showToast('Trade added');
  render();
  return false;
}
function handleDeleteTrade(id){
  deleteTrade(id);
  showToast('Trade removed');
  render();
}

/* ---------------- Render: Article detail ---------------- */
function renderArticle(){
  const a = articles.find(x=>x.id===currentArticleId);
  if(!a) return `<p style="padding-top:60px;">Article not found. <a class="back-link" onclick="go('home')">&larr; Back home</a></p>`;
  const paras = a.content.split('\n\n').map(p=>`<p>${p}</p>`).join('');
  return `
    <div class="article-detail" style="padding-top:36px;">
      <a class="back-link" onclick="go('home')">&larr; Back to Home</a>
      <p class="eyebrow">${a.team}</p>
      <h1>${a.title}</h1>
      <p class="meta">${a.author} · ${fmtDate(a.date)}</p>
      <div class="art-cap" style="${cardBg(a.team)}">${a.art}</div>
      <div class="body-copy">${paras}</div>
    </div>
  `;
}

/* ---------------- Render: Publish ---------------- */
function renderPublish(){
  const teamOptions = Object.keys(TEAM_COLORS).sort().map(t=>`<option value="${t}">${t}</option>`).join('');
  return `
    <div class="publish-panel" style="padding-top:40px;">
      <p class="eyebrow">Newsroom</p>
      <h2 class="section-title" style="margin-bottom:26px;">Publish an Article</h2>
      <form id="publishForm" onsubmit="return handlePublish(event)">
        <div class="field">
          <label>Headline</label>
          <input type="text" id="f-title" required maxlength="120" placeholder="e.g. Trade Deadline Winners and Losers">
        </div>
        <div class="row2">
          <div class="field">
            <label>Team Tag</label>
            <select id="f-team">${teamOptions}</select>
          </div>
          <div class="field">
            <label>Author</label>
            <input type="text" id="f-author" placeholder="Your name" value="Newsroom">
          </div>
        </div>
        <div class="field">
          <label>Dek (one-line summary)</label>
          <input type="text" id="f-dek" required maxlength="160" placeholder="A short summary shown on the homepage card">
        </div>
        <div class="field">
          <label>Article Body</label>
          <textarea id="f-content" required placeholder="Write the full article. Separate paragraphs with a blank line."></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Publish Article</button>
        <p class="form-note">Published articles are stored and visible to everyone who opens this page — there's no login, so treat it like a shared, public newsroom.</p>
      </form>
    </div>
  `;
}
async function handlePublish(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Publishing…';
  const title = document.getElementById('f-title').value.trim();
  const team = document.getElementById('f-team').value;
  const author = document.getElementById('f-author').value.trim() || 'Newsroom';
  const dek = document.getElementById('f-dek').value.trim();
  const content = document.getElementById('f-content').value.trim();
  const icons = ['🏀','📰','🎯','📈','🔥','🧠'];
  const article = {
    id: 'a-'+Date.now(),
    title, team, author, dek, content,
    date: new Date().toISOString().slice(0,10),
    art: icons[Math.floor(Math.random()*icons.length)]
  };
  saveNewArticle(article);
  showToast('Article published');
  go('home');
  return false;
}

/* ---------------- Router ---------------- */
function render(){
  const app = document.getElementById('app');
  if(currentView==='home') app.innerHTML = renderHome();
  else if(currentView==='standings') app.innerHTML = renderStandings();
  else if(currentView==='scores') app.innerHTML = renderScores();
  else if(currentView==='moves') app.innerHTML = renderMoves();
  else if(currentView==='trades') app.innerHTML = renderTrades();
  else if(currentView==='publish') app.innerHTML = renderPublish();
  else if(currentView==='article') app.innerHTML = renderArticle();

  document.querySelectorAll('nav.main button[data-v]').forEach(b=>{
    b.classList.toggle('active', b.dataset.v===currentView);
  });
  window.scrollTo({top:0, behavior:'instant'});
}
function go(view){ currentView = view; render(); }
function openArticle(id){ currentArticleId = id; currentView = 'article'; render(); }
function setConf(c){ currentConf = c; render(); }

document.querySelectorAll('nav.main button[data-v]').forEach(b=>{
  b.addEventListener('click', ()=>go(b.dataset.v));
});

/* ---------------- Init ---------------- */
(function init(){
  loadArticles();
  loadScores();
  loadMoves();
  loadTrades();
  loadStandings();
  render();
})();
</script>
</body>
</html>
