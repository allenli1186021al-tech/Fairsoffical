<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairs — NBA News &amp; Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15120e;
    --ink-soft:#211c15;
    --ink-line:#3a3226;
    --paper:#f2ece0;
    --paper-dim:#d9d0bd;
    --hardwood:#c1793c;
    --hardwood-deep:#8f5322;
    --buzzer:#d5473b;
    --court-line:#e9e0c9;
    --court-line-dim:#7c7261;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 700px at 15% -10%, rgba(193,121,60,.06), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 0%, rgba(193,121,60,.04), transparent 55%),
      var(--ink);
    color:var(--court-line);
    font-family:'Source Serif 4', serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton', sans-serif; letter-spacing:0.02em; text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono', monospace;}
  ::selection{background:var(--hardwood); color:var(--ink);}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:var(--ink);
    border-bottom:2px solid var(--ink-line);
    box-shadow:0 8px 24px rgba(0,0,0,.28);
  }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .logo{display:flex; align-items:center; gap:10px;}
  .logo .mark{
    width:38px;height:38px;border-radius:50%;
    object-fit:cover; flex:none; display:block;
  }
  .logo .word{ font-size:24px; color:var(--paper); }
  .logo .word span{color:var(--hardwood);}
  nav.main{display:flex; gap:6px; align-items:center;}
  nav.main button{
    background:none; border:none; color:var(--court-line-dim); position:relative;
    font-family:'Anton',sans-serif; letter-spacing:.06em; text-transform:uppercase;
    font-size:14px; padding:10px 14px; border-radius:3px; transition:color .15s ease, background .15s ease;
  }
  nav.main button:hover{color:var(--paper); background:rgba(255,255,255,.04);}
  nav.main button.active{color:var(--paper); background:none;}
  nav.main button.active::after{
    content:""; position:absolute; left:14px; right:14px; bottom:4px; height:2px; background:var(--hardwood); border-radius:1px;
  }
  .nav-team-wrap{position:relative; display:inline-block;}
  .nav-team-dropdown{
    position:absolute; top:100%; left:0;
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px;
    padding:16px; display:none; grid-template-columns:repeat(6,54px); gap:12px;
    z-index:80; box-shadow:0 16px 38px rgba(0,0,0,.5); max-width:420px;
  }
  .nav-team-wrap:hover .nav-team-dropdown{ display:grid; }
  .nav-team-cell{display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;}
  .nav-team-cell .abbr{font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--court-line-dim); transition:color .15s;}
  .nav-team-cell:hover .abbr{color:var(--paper);}
  .publish-btn{ background:var(--buzzer)!important; color:var(--paper)!important; }
  .publish-btn:hover{ filter:brightness(1.1); color:var(--paper)!important;}

  /* ---------- Layout ---------- */
  main{max-width:1180px; margin:0 auto; padding:0 24px 80px;}
  .divider-court{ height:0; border-top:2px dashed var(--ink-line); margin:44px 0; }
  .eyebrow{
    font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.14em;
    color:var(--hardwood); text-transform:uppercase; margin:0 0 10px;
  }

  /* ---------- Hero ---------- */
  .hero{ display:grid; grid-template-columns:1.3fr 1fr; gap:40px; padding:48px 0 8px; align-items:end; }
  .hero-headline{
    font-family:'Anton',sans-serif; font-size:clamp(38px,6vw,64px); line-height:0.98;
    color:var(--paper); margin:10px 0 18px; text-transform:uppercase;
  }
  .hero-dek{font-size:17px; line-height:1.55; color:var(--paper-dim); max-width:52ch;}
  .hero-meta{margin-top:20px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim);}
  .hero-side{ background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px; padding:22px; box-shadow:0 8px 22px rgba(0,0,0,.25); border-top:2px solid var(--hardwood); }
  .hero-side h3{
    font-family:'Anton',sans-serif; font-size:14px; letter-spacing:.08em; color:var(--paper);
    margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--ink-line);
  }
  .mini-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0; font-size:14px;}
  .mini-row+.mini-row{border-top:1px dotted var(--ink-line);}
  .mini-row .team{display:flex; align-items:center; gap:8px; color:var(--court-line);}
  .swatch{width:9px;height:18px;border-radius:1px; flex:none;}
  .team-badge{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    border-radius:50%; font-family:'JetBrains Mono',monospace; font-weight:700;
    color:rgba(255,255,255,.95); text-shadow:0 1px 1px rgba(0,0,0,.3);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
    transition: filter .15s;
  }
  .team-badge:hover, .team-logo-chip:hover{ filter:brightness(1.15); }
  .team-logo-chip{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    background:transparent;
    transition: filter .15s;
  }
  .team-logo-chip img{ display:block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .player-photo-placeholder{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    border-radius:50%; border:1.5px dashed var(--court-line-dim); color:var(--court-line-dim);
    font-weight:700; transition:border-color .15s, color .15s;
  }
  .player-photo-placeholder:hover{ border-color:var(--hardwood); color:var(--hardwood); }
  .mini-row .rec{font-family:'JetBrains Mono',monospace; color:var(--paper-dim); font-size:13px;}
  .see-all{
    display:block; text-align:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--ink-line);
    font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.08em; color:var(--hardwood);
  }
  .see-all:hover{color:var(--paper);}

  /* ---------- Article grid ---------- */
  .grid-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px;}
  .section-title{font-family:'Anton',sans-serif; font-size:28px; color:var(--paper); text-transform:uppercase; margin:0;}
  .article-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}
  .card{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
  }
  .card:hover{transform:translateY(-4px); border-color:var(--hardwood); box-shadow:0 14px 30px rgba(0,0,0,.35);}
  .card-art{ height:140px; display:flex; align-items:center; justify-content:center; font-size:44px; color:rgba(21,18,14,.55); }
  .card-body{padding:18px 18px 20px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--hardwood); letter-spacing:.04em;}
  .card h4{font-family:'Anton',sans-serif; font-size:19px; line-height:1.15; color:var(--paper); margin:0; text-transform:uppercase;}
  .card p{font-size:14px; line-height:1.5; color:var(--paper-dim); margin:0; flex:1;}
  .card-foot{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim); margin-top:4px;}

  /* ---------- Standings ---------- */
  .conf-toggle{display:flex; gap:8px; margin-bottom:20px;}
  .conf-toggle button{
    background:var(--ink-soft); border:1px solid var(--ink-line); color:var(--court-line-dim);
    font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.06em; padding:9px 18px; border-radius:2px;
  }
  .conf-toggle button.active{background:var(--hardwood); color:var(--ink); border-color:var(--hardwood);}
  table.standings{width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.2); border-radius:3px; overflow:hidden;}
  table.standings th{
    text-align:left; font-family:'Anton',sans-serif; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--court-line-dim); padding:10px 12px; border-bottom:2px solid var(--ink-line);
  }
  table.standings td{padding:14px 12px; border-bottom:1px solid var(--ink-line); color:var(--court-line);}
  table.standings tr:hover td{background:var(--ink-soft);}
  table.standings td.rank{color:var(--paper-dim); width:30px;}
  table.standings td.team-cell{color:var(--paper); font-family:'Source Serif 4',serif; font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px;}
  table.standings input{
    width:52px; background:var(--ink-soft); border:1px solid var(--ink-line); color:var(--court-line);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:5px 6px; border-radius:2px;
  }
  table.standings input:focus{outline:2px solid var(--hardwood); outline-offset:1px;}
  .standings-actions{display:flex; align-items:center; gap:14px; margin-top:18px;}

  /* ---------- Buttons / fields (shared) ---------- */
  .field{margin-bottom:18px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-family:'Anton',sans-serif; font-size:11px; letter-spacing:.08em; color:var(--hardwood); text-transform:uppercase;}
  .field input, .field select, .field textarea{
    background:var(--ink-soft); border:1px solid var(--ink-line); color:var(--paper);
    padding:11px 13px; border-radius:2px; font-family:'Source Serif 4',serif; font-size:15px;
  }
  .field textarea{min-height:180px; resize:vertical; line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--hardwood); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .row4{display:grid; grid-template-columns:1fr auto 1fr auto; gap:12px; align-items:end;}
  .submit-btn{
    background:var(--buzzer); color:var(--paper); border:none; padding:13px 26px;
    font-family:'Anton',sans-serif; letter-spacing:.06em; font-size:14px; border-radius:3px; text-transform:uppercase;
    box-shadow:0 4px 12px rgba(213,71,59,.25); transition:filter .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .submit-btn:hover{filter:brightness(1.12); transform:translateY(-1px); box-shadow:0 8px 18px rgba(213,71,59,.35);}
  .submit-btn:active{transform:translateY(0);}
  .submit-btn:disabled{opacity:.5; cursor:default; transform:none; box-shadow:none;}
  .ghost-btn{
    background:none; border:1px solid var(--ink-line); color:var(--court-line-dim);
    padding:12px 22px; font-family:'Anton',sans-serif; letter-spacing:.06em; font-size:13px; border-radius:3px; text-transform:uppercase;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .ghost-btn:hover{color:var(--paper); border-color:var(--hardwood); background:rgba(193,121,60,.08);}
  .form-note{font-size:13px; color:var(--court-line-dim); margin-top:10px; line-height:1.5;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--hardwood); color:var(--ink);
    padding:14px 20px; border-radius:2px; font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.04em;
    box-shadow:0 8px 24px rgba(0,0,0,.4); transform:translateY(140%); transition:transform .25s ease; z-index:100;
  }
  .toast.show{transform:translateY(0);}

  /* ---------- Scores page ---------- */
  .score-entry{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px; padding:18px 20px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(0,0,0,.16); transition:box-shadow .18s ease, border-color .18s ease;
  }
  .score-entry:hover{ box-shadow:0 8px 20px rgba(0,0,0,.28); border-color:var(--ink-line); }
  .score-line{display:flex; align-items:center; gap:16px; font-family:'JetBrains Mono',monospace; font-size:16px;}
  .score-line .vs-team{display:flex; align-items:center; gap:8px; color:var(--paper);}
  .score-line .score-num{font-size:22px; font-weight:700; color:var(--paper);}
  .score-status{font-family:'Anton',sans-serif; font-size:11px; letter-spacing:.06em; color:var(--hardwood);}
  .score-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim);}
  .empty-state{padding:60px 0; text-align:center; color:var(--court-line-dim); font-family:'JetBrains Mono',monospace; font-size:14px;}

  /* ---------- Free agency moves ---------- */
  .move-entry{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px; padding:16px 20px; margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(0,0,0,.16); transition:box-shadow .18s ease;
  }
  .move-entry:hover{ box-shadow:0 8px 20px rgba(0,0,0,.28); }
  .move-main{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .move-player{font-family:'Anton',sans-serif; font-size:17px; color:var(--paper); text-transform:uppercase; display:inline-flex; align-items:center; gap:8px;}
  .move-path{display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--paper-dim);}
  .move-team{display:flex; align-items:center; gap:6px;}
  .move-arrow{color:var(--hardwood);}
  .move-contract{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--hardwood);}
  .move-side{display:flex; align-items:center; gap:14px;}
  .move-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim);}
  .home-widget-list{display:flex; flex-direction:column; gap:0;}

  /* ---------- Trades ---------- */
  .trade-card{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px;
    margin-bottom:16px; overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.2); transition:box-shadow .18s ease;
  }
  .trade-card:hover{ box-shadow:0 10px 26px rgba(0,0,0,.32); }
  .trade-card-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px; border-bottom:1px dashed var(--ink-line);
  }
  .trade-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--court-line-dim);}
  .trade-body{display:grid; overflow-x:auto;}
  .trade-side{padding:18px 20px; min-width:180px;}
  .trade-team-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .trade-team-head .swatch{width:12px; height:22px;}
  .trade-team-head span{font-family:'Anton',sans-serif; font-size:16px; color:var(--paper); text-transform:uppercase;}
  .trade-receives-label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--court-line-dim); text-transform:uppercase; margin-bottom:6px;}
  .trade-assets{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
  .trade-assets li{font-size:14px; color:var(--court-line); padding-left:14px; position:relative;}
  .trade-assets li::before{content:"—"; position:absolute; left:0; color:var(--hardwood);}
  .trade-divider{
    width:1px; background:repeating-linear-gradient(to bottom, var(--ink-line) 0 6px, transparent 6px 12px);
    position:relative;
  }
  .trade-divider::after{
    content:"⇄"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--ink-soft); color:var(--hardwood); font-size:18px; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; border:1px solid var(--ink-line); border-radius:50%;
  }
  .trade-remove{padding:10px 18px 16px; text-align:right;}
  #tradeForm textarea{min-height:90px;}
  @media(max-width:640px){
    .trade-body{grid-template-columns:1fr !important;}
    .trade-divider{width:100%; height:1px; background:repeating-linear-gradient(to right, var(--ink-line) 0 6px, transparent 6px 12px);}
    .trade-divider::after{transform:translate(-50%,-50%) rotate(90deg);}
  }

  /* ---------- Stat leaders ---------- */
  .leaders-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px;}
  .leader-box{background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px; padding:18px 20px; box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .leader-box h4{font-family:'Anton',sans-serif; font-size:15px; letter-spacing:.04em; color:var(--paper); text-transform:uppercase; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--ink-line);}
  .leader-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; font-size:14px;}
  .leader-row+.leader-row{border-top:1px dotted var(--ink-line);}
  .leader-row .who{display:flex; align-items:center; gap:8px; color:var(--court-line);}
  .leader-row .who .rank{color:var(--court-line-dim); font-family:'JetBrains Mono',monospace; font-size:12px; width:16px;}
  .leader-row .val{font-family:'JetBrains Mono',monospace; color:var(--paper-dim); font-size:13px; display:flex; align-items:center; gap:10px;}
  .leader-row .rm{background:none; border:none; color:var(--court-line-dim); font-size:11px; cursor:pointer; padding:2px 4px;}
  .leader-row .rm:hover{color:var(--buzzer);}
  .leader-empty{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim); padding:6px 0;}
  @media(max-width:760px){ .leaders-grid{grid-template-columns:1fr;} }

  /* ---------- Simulator mode selection ---------- */
  .sim-mode-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:28px; max-width:760px; margin:0 auto;
  }
  .sim-mode-card{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:6px;
    padding:36px 28px; text-align:center; cursor:pointer;
    box-shadow:0 10px 28px rgba(0,0,0,.28); transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .sim-mode-card:hover{ transform:translateY(-6px); box-shadow:0 20px 44px rgba(0,0,0,.4); border-color:var(--hardwood); }
  .sim-mode-icon{
    width:88px; height:88px; border-radius:50%; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center; font-size:40px;
    box-shadow:0 8px 20px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.1);
  }
  .sim-mode-label{
    font-family:'Anton',sans-serif; font-size:26px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--paper); margin-bottom:10px;
  }
  @media(max-width:640px){ .sim-mode-grid{grid-template-columns:1fr;} }

  /* ---------- Article detail ---------- */
  .article-detail{max-width:720px; margin:0 auto;}
  .back-link{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim); display:inline-block; margin-bottom:24px;}
  .back-link:hover{color:var(--hardwood);}
  .article-detail h1{font-family:'Anton',sans-serif; font-size:clamp(30px,5vw,46px); color:var(--paper); text-transform:uppercase; line-height:1.02; margin:10px 0 16px;}
  .article-detail .meta{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim); margin-bottom:28px;}
  .article-detail .body-copy{font-size:18px; line-height:1.75; color:var(--court-line);}
  .article-detail .body-copy p{margin:0 0 20px;}
  .art-cap{ height:220px; margin-bottom:30px; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:64px; color:rgba(21,18,14,.55); }

  .publish-panel{max-width:720px; margin:0 auto;}

  footer{border-top:1px solid var(--ink-line); padding:30px 24px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--court-line-dim);}

  @media(max-width:860px){
    .hero{grid-template-columns:1fr;}
    .article-grid{grid-template-columns:1fr 1fr;}
    nav.main{display:none;}
    .row2{grid-template-columns:1fr;}
  }
  @media(max-width:560px){
    .article-grid{grid-template-columns:1fr;}
    .header-inner{padding:14px 16px;}
    .row4{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="site">

/* ---------------- Live data: Big Balls Sports Data API ---------------- */
// Free-tier key — visible in this public repo's source, which is expected for a
// static hobby site with no backend. Worst case someone else eats into the daily quota.
const BBS_API_KEY = 'bbs_live_00000I4RfaPn8KKHNsNzfVaHRBLIxRiaR3T47OSY9zSZAEeI';
const BBS_API = 'https://api.bigballsdata.com';
async function bbsFetch(path){
  try{
    const res = await fetch(BBS_API + path, {
      headers: { Authorization: 'Bearer ' + BBS_API_KEY }
    });
    if(!res.ok){
      console.warn('BBS API error', res.status, path);
      return null;
    }
    return await res.json();
  }catch(e){
    console.warn('BBS API fetch failed', e);
    return null;
  }
}
// Pull the first non-empty value out of a list of possible field names —
// used because a few stat field names aren't fully confirmed from public docs.
function pickField(obj, names){
  if(!obj) return undefined;
  for(const n of names){
    if(obj[n] !== undefined && obj[n] !== null) return obj[n];
  }
  return undefined;
}
let liveGames = [];
let livePollTimer = null;
let seenPlayIds = {}; // { gameId: Set of play ids already flashed }
let liveLoading = false;
let expandedGames = new Set(); // live games with box score expanded (by matchId)
let expandedFinalScores = new Set(); // saved score entries with box score expanded (by entry id)
let liveBoxScores = {}; // { matchId: {away:[...players], home:[...players]} } — fetched on demand
let lastPlayText = {}; // { gameId: "most recent play description" }
let gameStatusTracker = {}; // { matchId: last known status } — used to detect the live->final transition
function extractPlayerStatLine(p){
  // Best-effort: try current-game fields first, fall back to season averages if that's
  // all the API gives us. Field names aren't fully confirmed from public docs, so this
  // may need a small tweak once tested against a real live game.
  const src = p.game_stats || p.stats || p.box_score || p.current || p.season_averages || p.averages || {};
  return {
    name: pickField(p, ['name','player_name','full_name']) || 'Unknown',
    pts: pickField(src, ['pts','points']) ?? '-',
    reb: pickField(src, ['reb','rebounds']) ?? '-',
    ast: pickField(src, ['ast','assists']) ?? '-',
    stl: pickField(src, ['stl','steals']) ?? '-',
    blk: pickField(src, ['blk','blocks']) ?? '-',
    tov: pickField(src, ['tov','turnovers']) ?? '-'
  };
}
function extractBoxScore(matchupData){
  const away = (matchupData.away_team && matchupData.away_team.players || []).map(extractPlayerStatLine);
  const home = (matchupData.home_team && matchupData.home_team.players || []).map(extractPlayerStatLine);
  return { away, home };
}

/* ---------------- Storage: local (works on any real host, saved in this browser) ---------------- */
const localDB = {
  get(key){
    try{
      const v = localStorage.getItem('fairs:'+key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  },
  set(key, value){
    try{
      localStorage.setItem('fairs:'+key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }
};

/* ---------------- Storage: articles ---------------- */
function loadArticles(){
  articles = localDB.get('articles') || [];
}
function saveNewArticle(article){
  const stored = localDB.get('articles') || [];
  stored.unshift(article);
  localDB.set('articles', stored);
  articles = stored;
}

function deleteScore(id){
  const stored = (localDB.get('scores') || []).filter(s=>s.id!==id);
  localDB.set('scores', stored);
  scores = stored;
}

/* ---------------- Storage: seasons ---------------- */
function currentSeasonLabel(){
  const now = new Date();
  const y = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear()-1; // NBA season starts ~Oct
  return `${y}-${String((y+1)%100).padStart(2,'0')}`;
}
function migrateLegacyData(defaultSeason){
  // Before seasons existed, standings/stat leaders were stored under plain keys.
  // If that old data exists and hasn't been migrated yet, move it into the default season.
  try{
    const legacyStandings = localStorage.getItem('fairs:standings');
    const scopedKey = 'fairs:standings:'+defaultSeason;
    if(legacyStandings && !localStorage.getItem(scopedKey)){
      localStorage.setItem(scopedKey, legacyStandings);
    }
    const legacyLeaders = localStorage.getItem('fairs:stat-leaders');
    const scopedLeadersKey = 'fairs:stat-leaders:'+defaultSeason;
    if(legacyLeaders && !localStorage.getItem(scopedLeadersKey)){
      localStorage.setItem(scopedLeadersKey, legacyLeaders);
    }
  }catch(e){ /* ignore */ }
}
function loadSeasons(){
  seasons = localDB.get('seasons') || [];
  if(seasons.length===0){
    seasons = [currentSeasonLabel()];
    localDB.set('seasons', seasons);
  }
  migrateLegacyData(seasons[0]);
  activeSeason = localDB.get('active-season') || seasons[seasons.length-1];
  if(!seasons.includes(activeSeason)) activeSeason = seasons[seasons.length-1];
}
function addSeason(label){
  label = label.trim();
  if(!label) return false;
  if(!seasons.includes(label)){
    seasons.push(label);
    seasons.sort();
    localDB.set('seasons', seasons);
  }
  setActiveSeason(label);
  return true;
}
function setActiveSeason(label){
  activeSeason = label;
  localDB.set('active-season', label);
  loadStandings();
  loadStatLeaders();
  loadDraft();
}

function resizeImageToDataUrl(file, size, mode, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      if(mode === 'contain'){
        // Fit the whole image inside the square without cropping — right for logos of any shape.
        const scale = Math.min(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.clearRect(0,0,size,size);
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        callback(canvas.toDataURL('image/png'));
      } else {
        // Crop to fill the square — right for headshots/portraits.
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.clearRect(0,0,size,size);
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        callback(canvas.toDataURL('image/png'));
      }
    };
    img.onerror = function(){ showToast('Could not read that image'); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ showToast('Could not read that file'); };
  reader.readAsDataURL(file);
}

function escAttr(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sortByRecency(list){
  // Sorts by entered date first; falls back to creation time (embedded in id) when no date was given.
  const timeOf = (item) => {
    if(item.date){
      const t = new Date(item.date+'T00:00:00').getTime();
      if(!isNaN(t)) return t;
    }
    const parts = (item.id||'').split('-');
    const n = parseInt(parts[1],10);
    return isNaN(n) ? 0 : n;
  };
  return [...list].sort((a,b)=> timeOf(b) - timeOf(a));
}

/* ---------------- Simulator: chemistry, matchups, game engine ---------------- */
function computeTeamChemistry(team){
  const roster = (simRosters[team]||[]).filter(p=>p.archetype);
  if(roster.length===0) return 75;
  const counts = {};
  roster.forEach(p=>{ counts[p.archetype]=(counts[p.archetype]||0)+1; });
  const distinct = Object.keys(counts).length;
  let chem = 72 + distinct*3;
  const maxCount = Math.max(...Object.values(counts));
  if(maxCount>2) chem -= (maxCount-2)*3;
  return Math.max(55, Math.min(99, Math.round(chem)));
}
function teamPower(team){
  const roster = (simRosters[team]||[]).filter(p=>p.overall);
  const chemistry = computeTeamChemistry(team);
  if(roster.length===0) return { avgOverall:70, chemistry, offenseTilt:0, defenseTilt:0, players:[] };
  const sorted = [...roster].sort((a,b)=>b.overall-a.overall).slice(0,9);
  const weights = [1,0.95,0.9,0.85,0.75,0.6,0.5,0.4,0.3];
  let wSum=0, wTotal=0;
  sorted.forEach((p,i)=>{ const w=weights[i]||0.2; wSum+=p.overall*w; wTotal+=w; });
  const avgOverall = wTotal ? wSum/wTotal : 70;
  let offenseTilt=0, defenseTilt=0;
  sorted.forEach(p=>{
    if(!p.archetype) return;
    if(['Scorer','Playmaker','Stretch Big','Combo Guard'].includes(p.archetype)) offenseTilt+=p.overall;
    if(['3&D','Rim Protector','Two-Way Wing'].includes(p.archetype)) defenseTilt+=p.overall;
  });
  return { avgOverall, chemistry, offenseTilt, defenseTilt, players: sorted };
}
function simulateGame(teamA, teamB){
  const A = teamPower(teamA), B = teamPower(teamB);
  const edgeA = (A.offenseTilt - B.defenseTilt) / 100;
  const edgeB = (B.offenseTilt - A.defenseTilt) / 100;
  function genScore(power, edge){
    let base = 96 + (power.avgOverall - 78) * 0.9 + (power.chemistry-75)*0.15 + edge*1.2;
    let rand = 0;
    for(let i=0;i<4;i++) rand += (Math.random()-0.5)*8;
    return Math.max(78, Math.round(base+rand));
  }
  const scoreA = genScore(A, edgeA);
  const scoreB = genScore(B, edgeB);
  function genBoxScore(power, teamScore){
    if(power.players.length===0) return [];
    const overallSum = power.players.reduce((s,p)=>s+p.overall,0);
    return power.players.map(p=>{
      const share = p.overall/overallSum;
      const pts = Math.max(0, Math.round(teamScore*share*(0.85+Math.random()*0.3)));
      const reb = Math.max(0, Math.round((['Rim Protector','Stretch Big'].includes(p.archetype)?9:4)*(0.7+Math.random()*0.6)));
      const ast = Math.max(0, Math.round((['Playmaker','Combo Guard'].includes(p.archetype)?7:2)*(0.7+Math.random()*0.6)));
      const stl = Math.round(Math.random()*2);
      const blk = Math.round((p.archetype==='Rim Protector'?1.5:0.3)*Math.random()*2);
      const tov = Math.round(Math.random()*3);
      return { name:p.name, pts, reb, ast, stl, blk, tov };
    });
  }
  return {
    scoreA, scoreB,
    boxA: genBoxScore(A, scoreA), boxB: genBoxScore(B, scoreB),
    chemA: A.chemistry, chemB: B.chemistry
  };
}

function handleSeedSimRosters(){

  showToast(count>0 ? `Populated ${count} teams` : 'All teams already have rosters');
  render();
}
function handleAddSimRosterPlayer(e){
  e.preventDefault();
  const name = document.getElementById('sim-roster-name').value.trim();
  const position = document.getElementById('sim-roster-position').value.trim();
  const overall = parseInt(document.getElementById('sim-roster-overall').value,10) || null;
  const age = parseInt(document.getElementById('sim-roster-age').value,10) || null;
  const archetype = document.getElementById('sim-roster-archetype').value;
  addSimRosterPlayer(simMyTeam, { id:'sim-r-'+Date.now(), name, position, overall, age, archetype });
  showToast('Player added');
  render();
  return false;
}
function handleRemoveSimRosterPlayer(id){
  removeSimRosterPlayer(simMyTeam, id);
  showToast('Removed');
  render();
}
function handleSaveRatings(){
  const team = simMyTeam;
  const all = localDB.get('sim-rosters') || {};
  const list = all[team] || [];
  const updates = {};
  document.querySelectorAll('[data-rate-id]').forEach(el=>{
    const id = el.dataset.rateId, field = el.dataset.rateField;
    if(!updates[id]) updates[id] = {};
    updates[id][field] = el.value;
  });
  list.forEach(p=>{
    const u = updates[p.id];
    if(!u) return;
    if(u.overall !== undefined) p.overall = u.overall ? parseInt(u.overall,10) : null;
    if(u.archetype !== undefined) p.archetype = u.archetype;
    if(u.age !== undefined) p.age = u.age ? parseInt(u.age,10) : null;
  });
  all[team] = list;
  localDB.set('sim-rosters', all);
  simRosters = all;
  showToast('Ratings saved');
  render();
}
function handleSimulateGame(){
  const opponent = document.getElementById('sim-opponent').value;
  simTeamA = simMyTeam; simTeamB = opponent;
  simResult = simulateGame(simMyTeam, opponent);
  render();
}
function handleSaveSimToScores(){
  const entry = {
    id: 's-sim-'+Date.now(),
    away: simTeamA, awayScore: simResult.scoreA,
    home: simTeamB, homeScore: simResult.scoreB,
    status: 'FINAL', date: new Date().toISOString().slice(0,10),
    boxScore: { away: simResult.boxA, home: simResult.boxB }
  };
  saveNewScore(entry);
  showToast('Saved to Scores');
}

/* ---------------- Live: fetch games, poll, flash plays, auto-finalize ---------------- */
async function fetchLiveGames(){
  liveLoading = liveGames.length===0;
  render();
  const result = await bbsFetch('/v1/nba/games?limit=25');
  liveLoading = false;
  liveGames = (result && result.data) ? result.data : [];
  await checkForNewlyFinishedGames();
  render();
}
function isGameLive(g){
  const status = String(pickField(g, ['status','game_status','state']) || '').toLowerCase();
  return status.includes('progress') || status.includes('live');
}
function isGameFinal(g){
  const status = String(pickField(g, ['status','game_status','state']) || '').toLowerCase();
  return status.includes('final') || status.includes('complete') || status.includes('closed');
}
function gameTeamInfo(teamObj){
  return {
    name: pickField(teamObj, ['name','team_name','full_name']) || '',
    abbr: pickField(teamObj, ['abbreviation','tricode','abbr','code']) || '',
    score: pickField(teamObj, ['score','points','pts']) ?? '-'
  };
}
function startLivePolling(){
  stopLivePolling();
  livePollTimer = setInterval(()=>{
    if(currentView==='scores') fetchLiveGames();
  }, 30000);
}
function stopLivePolling(){
  if(livePollTimer){ clearInterval(livePollTimer); livePollTimer = null; }
}
async function watchGamePlays(matchId, gameId){
  const result = await bbsFetch(`/v1/nba/games/${gameId}/plays`);
  if(!result || !result.data || result.data.length===0) return;
  const plays = result.data;
  if(!seenPlayIds[gameId]) seenPlayIds[gameId] = new Set();
  const seen = seenPlayIds[gameId];
  const keywords = ['three','3-pt','3pt','layup','dunk','block','steal'];
  const mostRecent = plays[plays.length-1];
  const mostRecentDesc = String(pickField(mostRecent, ['description','desc','text','play']) || '');
  if(mostRecentDesc) lastPlayText[gameId] = mostRecentDesc;
  plays.forEach(p=>{
    const id = pickField(p, ['id','play_id','event_id']) ?? JSON.stringify(p).slice(0,40);
    if(seen.has(id)) return;
    seen.add(id);
    const desc = String(pickField(p, ['description','desc','text','play']) || '');
    const lower = desc.toLowerCase();
    if(keywords.some(k=>lower.includes(k)) && desc){
      showToast(desc);
    }
  });
  render();
}
async function toggleGameBoxScore(matchId){
  if(expandedGames.has(matchId)){
    expandedGames.delete(matchId);
    render();
    return;
  }
  expandedGames.add(matchId);
  render();
  if(!liveBoxScores[matchId]){
    const result = await bbsFetch(`/v1/nba/games/${matchId}/matchup`);
    if(result && result.data) liveBoxScores[matchId] = extractBoxScore(result.data);
    render();
  }
}
function toggleFinalBoxScore(entryId){
  if(expandedFinalScores.has(entryId)) expandedFinalScores.delete(entryId);
  else expandedFinalScores.add(entryId);
  render();
}
async function checkForNewlyFinishedGames(){
  for(const g of liveGames){
    const matchId = pickField(g, ['match_id','id']);
    if(!matchId) continue;
    const status = String(pickField(g, ['status','game_status','state']) || '').toLowerCase();
    const prevStatus = gameStatusTracker[matchId];
    gameStatusTracker[matchId] = status;
    const alreadySaved = scores.some(s=>s.sourceId===matchId);
    if(isGameFinal(g) && prevStatus && prevStatus!==status && !alreadySaved){
      await autoFinalizeGame(g, matchId);
    } else if(isGameFinal(g) && !alreadySaved && !prevStatus){
      // First time we've seen this game and it's already final (e.g. page just opened) — save it too.
      await autoFinalizeGame(g, matchId);
    }
  }
}
async function autoFinalizeGame(g, matchId){
  const home = gameTeamInfo(g.home_team||{});
  const away = gameTeamInfo(g.away_team||{});
  let boxScore = null;
  const result = await bbsFetch(`/v1/nba/games/${matchId}/matchup`);
  if(result && result.data) boxScore = extractBoxScore(result.data);
  const entry = {
    id: 's-'+Date.now()+'-'+matchId,
    sourceId: matchId,
    away: away.abbr, awayScore: away.score,
    home: home.abbr, homeScore: home.score,
    status: 'FINAL',
    date: new Date().toISOString().slice(0,10),
    boxScore
  };
  saveNewScore(entry);
  showToast(`${away.abbr} ${away.score} – ${home.score} ${home.abbr} FINAL`);
}
function boxScoreTableHtml(boxScore, awayAbbr, homeAbbr){
  if(!boxScore) return `<div class="form-note" style="padding:10px 0;">Box score unavailable.</div>`;
  const col = (players, abbr) => `
    <div style="flex:1; min-width:200px;">
      <div class="form-note" style="color:var(--paper); font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.06em; margin-bottom:8px;">${abbr}</div>
      ${players.length ? players.map(p=>`
        <div style="display:flex; justify-content:space-between; padding:5px 0; border-top:1px dotted var(--ink-line); font-size:12px;">
          <span style="color:var(--court-line);">${p.name}</span>
          <span class="mono" style="color:var(--paper-dim);">${p.pts}p ${p.reb}r ${p.ast}a ${p.stl}s ${p.blk}b ${p.tov}to</span>
        </div>`).join('') : `<div class="form-note" style="padding:6px 0;">No player data.</div>`}
    </div>`;
  return `<div style="display:flex; gap:24px; flex-wrap:wrap; padding:14px 0 4px;">${col(boxScore.away, awayAbbr)}${col(boxScore.home, homeAbbr)}</div>`;
}
function liveGameCardHtml(g){
  const home = gameTeamInfo(g.home_team||{});
  const away = gameTeamInfo(g.away_team||{});
  const period = pickField(g, ['period','quarter','current_period']) || '';
  const clock = pickField(g, ['clock','game_clock','time_remaining']) || '';
  const matchId = pickField(g, ['match_id','id']);
  const gameId = pickField(g, ['game_id','nba_game_id']);
  if(matchId && gameId) watchGamePlays(matchId, gameId);
  const expanded = matchId && expandedGames.has(matchId);
  return `
    <div class="score-entry" style="flex-direction:column; align-items:stretch; gap:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;">
        <div class="score-line">
          <span class="vs-team">${away.abbr} <span class="score-num">${away.score}</span></span>
          <span style="color:var(--court-line-dim);">&ndash;</span>
          <span class="vs-team"><span class="score-num">${home.score}</span> ${home.abbr}</span>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="score-status" style="color:var(--buzzer);">● LIVE</span>
          <span class="score-date">${period ? 'Q'+period : ''} ${clock}</span>
          ${matchId ? `<button class="ghost-btn" style="padding:6px 12px; font-size:11px;" onclick="toggleGameBoxScore('${matchId}')">${expanded?'Hide':'Show'} Box Score</button>` : ''}
        </div>
      </div>
      ${gameId && lastPlayText[gameId] ? `<div class="form-note" style="color:var(--court-line);">Latest: ${lastPlayText[gameId]}</div>` : ''}
      ${expanded ? boxScoreTableHtml(liveBoxScores[matchId], away.abbr, home.abbr) : ''}
    </div>`;
}

let fetchedArticleImage = null;
async function handleFetchLinkPreview(){
  const btn = document.getElementById('fetchLinkBtn');
  const url = document.getElementById('f-link-input').value.trim();
  if(!url){ showToast('Paste a link first'); return; }
  btn.disabled = true; btn.textContent = 'Fetching…';
  try{
    const res = await fetch('https://api.microlink.io?url=' + encodeURIComponent(url));
    const json = await res.json();
    if(json.status !== 'success'){ throw new Error('bad response'); }
    const d = json.data;
    document.getElementById('f-title').value = d.title || '';
    document.getElementById('f-dek').value = (d.description || '').slice(0,160);
    document.getElementById('f-source-name').value = (d.publisher || d.author || '') ;
    document.getElementById('f-source-url').value = url;
    fetchedArticleImage = d.image && d.image.url ? d.image.url : null;
    const box = document.getElementById('linkPreviewBox');
    box.innerHTML = fetchedArticleImage
      ? `<div style="margin:12px 0; display:flex; gap:14px; align-items:center;"><img src="${fetchedArticleImage}" style="width:90px;height:60px;object-fit:cover;border-radius:2px;"><span class="form-note">Preview image will be used as the article's photo.</span></div>`
      : `<p class="form-note" style="margin:10px 0;">No preview image found on that page — headline and source were still filled in.</p>`;
    if(!document.getElementById('f-content').value.trim()){
      document.getElementById('f-content').placeholder = 'Write your own take on this story in your own words — don\'t paste the original article text.';
    }
    showToast('Preview loaded — write your own take below');
  }catch(err){
    showToast('Could not fetch a preview for that link');
  }
  btn.disabled = false; btn.textContent = 'Fetch Preview';
}
async function handlePublish(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Publishing…';
  const title = document.getElementById('f-title').value.trim();
  const team = document.getElementById('f-team').value;

  const dek = document.getElementById('f-dek').value.trim();
  const content = document.getElementById('f-content').value.trim();
  const sourceName = document.getElementById('f-source-name').value.trim();
  const sourceUrl = document.getElementById('f-source-url').value.trim();
  const icons = ['🏀','📰','🎯','📈','🔥','🧠'];
  const article = {
    id: 'a-'+Date.now(),
    title, team, author, dek, content,
    sourceName, sourceUrl,
    image: fetchedArticleImage,
    date: new Date().toISOString().slice(0,10),
    art: icons[Math.floor(Math.random()*icons.length)]
  };
  saveNewArticle(article);
  fetchedArticleImage = null;
  showToast('Article published');
  go('home');
  return false;
}

  else if(currentView==='article') app.innerHTML = renderArticle();

  document.querySelectorAll('nav.main button[data-v]').forEach(b=>{
    b.classList.toggle('active', b.dataset.v===currentView || (currentView==='team' && b.dataset.v==='teams') || (currentView.startsWith('simulator') && b.dataset.v==='simulator'));
  });
  renderNavTeamDropdown();
  window.scrollTo({top:0, behavior:'instant'});
}
function go(view){
  currentView = view;
  if(view==='scores'){
    render();
    fetchLiveGames();
    startLivePolling();
  } else {
    stopLivePolling();
    render();
  }
}
function openArticle(id){ currentArticleId = id; currentView = 'article'; render(); }
function setConf(c){ currentConf = c; render(); }

document.querySelectorAll('nav.main button[data-v]').forEach(b=>{
  b.addEventListener('click', ()=>go(b.dataset.v));
});

/* ---------------- Init ---------------- */
(function init(){
  loadArticles();
  loadScores();
  loadMoves();
  loadTrades();
  loadTeamLogos();
  loadPlayerPhotos();
  loadRosters();
  loadSimRosters();
  loadSeasons();
  loadStatLeaders();
  loadStandings();
  loadDraft();
  render();
})();
</script>
